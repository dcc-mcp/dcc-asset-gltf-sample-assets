tools:
  - name: search_gltf_sample_assets
    description: Search Khronos glTF sample model directories.
    source_file: scripts/search_gltf_sample_assets.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: gltf-samples
    input_schema:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    output_schema:
      type: object

  - name: list_gltf_sample_files
    description: List files for one Khronos glTF sample model.
    source_file: scripts/list_gltf_sample_files.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations:
      read_only_hint: true
      idempotent_hint: true
      open_world_hint: true
    group: gltf-samples
    input_schema:
      type: object
      required: ["model_name"]
      properties:
        model_name:
          type: string
    output_schema:
      type: object

  - name: download_gltf_sample_file
    description: Download one file from Khronos glTF Sample Assets.
    source_file: scripts/download_gltf_sample_file.py
    execution: sync
    affinity: any
    timeout_hint_secs: 180
    enforce_thread_affinity: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    group: gltf-samples
    input_schema:
      type: object
      required: ["path", "output_dir"]
      properties:
        path:
          type: string
        output_dir:
          type: string
    output_schema:
      type: object
